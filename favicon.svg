<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Umbră card & pin -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.22" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradient Pin -->
    <linearGradient id="pinGrad" x1="20" y1="35" x2="100" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Gradient Hârtie Polaroid -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Gradient Cer Vacanță -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Gradient Mare -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Mască decupare imagine vacanță în card -->
    <clipPath id="photoClip">
      <rect x="36" y="16" width="56" height="42" rx="4" />
    </clipPath>

    <!-- Mască decupare fereastră pin -->
    <clipPath id="pinHoleClip">
      <circle cx="70" cy="62" r="21" />
    </clipPath>
  </defs>

  <!-- Umbra de la baza pinului -->
  <ellipse cx="70" cy="129" rx="18" ry="5.5" fill="#0f172a" opacity="0.25" />

  <!-- ================= CARTE POSTALĂ / POLAROID VACANȚĂ CARE IESE DIN PIN ================= -->
  <g transform="rotate(-7 70 50)" filter="url(#shadow)">
    <!-- Rama Polaroid albă -->
    <rect x="32" y="12" width="64" height="66" rx="6" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Zona foto din card -->
    <g clip-path="url(#photoClip)">
      <!-- Cer și apus cald de vacanță -->
      <rect x="36" y="16" width="56" height="42" fill="url(#skyGrad)" />

      <!-- Soare cald -->
      <circle cx="68" cy="35" r="9" fill="#fef08a" opacity="0.95" />

      <!-- Munte / Deal în zare -->
      <path d="M34 47 Q 48 38 60 44 Q 72 50 94 43 L94 60 L34 60 Z" fill="#f472b6" opacity="0.7" />

      <!-- Mare albastră -->
      <path d="M34 46 Q 50 49 65 47 Q 80 45 94 48 L94 60 L34 60 Z" fill="url(#seaGrad)" />

      <!-- Val alb strălucitor -->
      <path d="M36 49 Q 52 52 68 50 Q 84 48 94 51" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8" />

      <!-- Palmier pe plajă -->
      <!-- Trunchi -->
      <path d="M43 58 Q 47 48 48 40" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <!-- Frunze palmier -->
      <path d="M48 40 Q 42 37 38 39" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M48 40 Q 47 34 44 32" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M48 40 Q 52 35 56 34" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M48 40 Q 55 39 58 43" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M48 40 Q 46 43 43 45" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Banda de jos Polaroid (linii stilizate de notiță) -->
    <line x1="42" y1="67" x2="62" y2="67" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <circle cx="85" cy="67" r="2.2" fill="#f43f5e" />
  </g>

  <!-- ================= PINUL DE HARTĂ (CORP PRINCIPAL) ================= -->
  <g filter="url(#shadow)">
    <!-- Contur Pin Modern -->
    <path d="M70 126 C64 116 38 88 38 62 C38 44.3 52.3 30 70 30 C87.7 30 102 44.3 102 62 C102 88 76 116 70 126 Z" 
          fill="url(#pinGrad)" 
          stroke="#ffffff" 
          stroke-width="2.5" />

    <!-- Reflexie elegantă de lumină pe marginea pinului -->
    <path d="M45 52 C45 42 54 35 66 33" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />

    <!-- Orificiul din mijloc al pinului (prin care se vede cardul de vacanță trecând) -->
    <circle cx="70" cy="62" r="16.5" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    
    <!-- Miez interior decorativ (mini busolă / inimioară subtilă) -->
    <path d="M70 56 C71.5 54 75 54 76.5 56 C78 58 78 60.5 76 62.5 L70 68 L64 62.5 C62 60.5 62 58 63.5 56 C65 54 68.5 54 70 56 Z" 
          fill="#f43f5e" />
  </g>

  <!-- Mică steluță / sclipire de vacanță -->
  <path d="M106 24 L108 29 L113 31 L108 33 L106 38 L104 33 L99 31 L104 29 Z" fill="#fbbf24" opacity="0.9" />
  <circle cx="28" cy="46" r="2" fill="#fbbf24" opacity="0.75" />
</svg>
